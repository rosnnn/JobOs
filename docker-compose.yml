services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run start -- -p 3000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      - api

  api:
    build: .
    command: uvicorn job_os.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - browser_artifacts:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JOB_OS_DATABASE_URL: postgresql+asyncpg://jobos:jobos@postgres:5432/jobos
      JOB_OS_REDIS_URL: redis://redis:6379/0
      JOB_OS_CELERY_BROKER_URL: redis://redis:6379/1
      JOB_OS_ARTIFACT_PATH: /app/data/artifacts

  worker:
    build: .
    command: celery -A job_os.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - browser_artifacts:/app/data/artifacts
    depends_on:
      - api
      - redis
      - postgres
    environment:
      JOB_OS_DATABASE_URL: postgresql+asyncpg://jobos:jobos@postgres:5432/jobos
      JOB_OS_REDIS_URL: redis://redis:6379/0
      JOB_OS_CELERY_BROKER_URL: redis://redis:6379/1

  beat:
    build: .
    command: celery -A job_os.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - worker
    environment:
      JOB_OS_CELERY_BROKER_URL: redis://redis:6379/1

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobos
      POSTGRES_PASSWORD: jobos
      POSTGRES_DB: jobos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobos -d jobos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  browser_artifacts:
